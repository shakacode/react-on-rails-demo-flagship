name: Review app

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  deployments: write
  issues: write
  pull-requests: write

jobs:
  deploy-review:
    uses: shakacode/control-plane-flow/.github/workflows/cpflow-deploy-review-app.yml@v5.1.1
    secrets:
      CPLN_TOKEN_STAGING: ${{ secrets.CPLN_TOKEN_STAGING }}
      DOCKER_BUILD_SSH_KEY: ${{ secrets.DOCKER_BUILD_SSH_KEY }}
  hosted-review:
    needs: deploy-review
    if: always() && github.event_name == 'pull_request'
    uses: ./.github/workflows/verify-hosted-app.yml
    with:
      app_name: react-on-rails-demo-flagship-review-${{ github.event.pull_request.number }}
      revision: ${{ github.event.pull_request.head.sha }}
    secrets:
      CPLN_TOKEN_STAGING: ${{ secrets.CPLN_TOKEN_STAGING }}
