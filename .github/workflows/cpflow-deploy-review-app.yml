name: Review app

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  deployments: write
  issues: write
  pull-requests: write

concurrency:
  group: flagship-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy-review:
    uses: shakacode/control-plane-flow/.github/workflows/cpflow-deploy-review-app.yml@b1e5ff4a04adfccfd8b59996e8abdbb5defb3fd6 # v5.3.0
    secrets:
      CPLN_TOKEN_STAGING: ${{ secrets.CPLN_TOKEN_STAGING }}
      DOCKER_BUILD_SSH_KEY: ${{ secrets.DOCKER_BUILD_SSH_KEY }}
  hosted-review:
    needs: deploy-review
    if: always() && github.event_name == 'pull_request'
    uses: ./.github/workflows/verify-hosted-app.yml
    with:
      deployment_succeeded: ${{ needs.deploy-review.result == 'success' }}
      app_name: react-on-rails-demo-flagship-review-${{ github.event.pull_request.number }}
      revision: ${{ github.event.pull_request.head.sha }}
    secrets:
      CPLN_TOKEN_STAGING: ${{ secrets.CPLN_TOKEN_STAGING }}
