name: Deploy Staging to Control Plane

run-name: Deploy Control Plane staging app

on:
  push:
    # GitHub does not allow repository vars in branch filters. If
    # STAGING_APP_BRANCH is later changed in repository variables, keep this list
    # in sync so pushes to that branch actually trigger the workflow.
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flagship-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    uses: shakacode/control-plane-flow/.github/workflows/cpflow-deploy-staging.yml@6aa575780f2d9175755881b79cbb3253adbc9c1f # v6.0.1
    with:
      staging_app_branch_default: ""
    secrets:
      CPLN_TOKEN_STAGING: ${{ secrets.CPLN_TOKEN_STAGING }}
      DOCKER_BUILD_SSH_KEY: ${{ secrets.DOCKER_BUILD_SSH_KEY }}
  verify-staging:
    needs: deploy-staging
    uses: ./.github/workflows/verify-hosted-app.yml
    with:
      deployment_succeeded: ${{ needs.deploy-staging.result == 'success' }}
      app_name: react-on-rails-demo-flagship-staging
      revision: ${{ github.sha }}
    secrets:
      CPLN_TOKEN_STAGING: ${{ secrets.CPLN_TOKEN_STAGING }}
