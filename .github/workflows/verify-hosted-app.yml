name: Verify hosted app

on:
  workflow_call:
    inputs:
      deployment_succeeded:
        required: true
        type: boolean
      app_name:
        required: true
        type: string
      revision:
        required: true
        type: string
    secrets:
      CPLN_TOKEN_STAGING:
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Hosted review app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a successful deployment
        if: ${{ !inputs.deployment_succeeded }}
        run: |
          echo 'Deployment did not succeed; hosted validation cannot pass.' >&2
          exit 1
      - name: Require a trusted review branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Hosted validation requires a reviewed branch in this repository.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.12.0'
          cache: npm
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.4.6'
      - name: Install browser and Control Plane tooling
        run: npm ci && npx playwright install --with-deps chromium && npm install --global @controlplane/cli@3.14.1
      - name: Wait for the exact hosted revision
        env:
          APP_NAME: ${{ inputs.app_name }}
          EXPECTED_REVISION: ${{ inputs.revision }}
          CPLN_ORG_STAGING: ${{ vars.CPLN_ORG_STAGING }}
          CPLN_TOKEN: ${{ secrets.CPLN_TOKEN_STAGING }}
        run: bin/verify-hosted-deployment "$APP_NAME" "$EXPECTED_REVISION"
      - name: Exercise hosted streaming and mutations
        env:
          PLAYWRIGHT_ALLOW_REMOTE_MUTATIONS: 'true'
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: npm run test:browser
      - name: Confirm the revision after browser checks
        env:
          APP_NAME: ${{ inputs.app_name }}
          EXPECTED_REVISION: ${{ inputs.revision }}
          CPLN_ORG_STAGING: ${{ vars.CPLN_ORG_STAGING }}
          CPLN_TOKEN: ${{ secrets.CPLN_TOKEN_STAGING }}
        run: bin/verify-hosted-deployment "$APP_NAME" "$EXPECTED_REVISION"
      - name: Record hosted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-${{ inputs.app_name }}-${{ inputs.revision }}-${{ github.run_attempt }}
          path: |
            tmp/hosted-deployment.json
            tmp/playwright-test-results
