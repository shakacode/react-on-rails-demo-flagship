# Control Plane config for the flagship React on Rails demo.
# The container entrypoint intentionally restores deterministic demo data when
# Rails starts, so review, staging, and production do not use persistent SQLite.

allow_org_override_by_env: true
allow_app_override_by_env: true

aliases:
  common: &common
    cpln_org: shakacode-open-source-examples-staging
    default_location: aws-us-east-2
    dockerfile: ../Dockerfile
    setup_app_templates:
      - app
      - rails
      - node-renderer

    one_off_workload: rails
    app_workloads:
      - rails
      - node-renderer
    deploy_order:
      - [node-renderer]
      - [rails]
    additional_workloads: []

    fix_terminal_size: true
    image_retention_days: 30

  production: &production
    <<: *common
    allow_org_override_by_env: false
    allow_app_override_by_env: false
    cpln_org: my-org-production # TODO: replace with the real production Control Plane org.
    upstream: react-on-rails-demo-flagship-staging

apps:
  react-on-rails-demo-flagship-staging:
    <<: *common
    secrets_name: react-on-rails-demo-flagship-staging-secrets

  react-on-rails-demo-flagship-review:
    <<: *common
    match_if_app_name_starts_with: true
    secrets_name: react-on-rails-demo-flagship-review-secrets

  react-on-rails-demo-flagship-production:
    <<: *production
    secrets_name: react-on-rails-demo-flagship-production-secrets
